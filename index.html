<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arafat Rohman - Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            margin: 20px;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4f46e5;
            margin-bottom: 20px;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 26px;
            color: #1f2937;
        }
        .bio {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .details {
            text-align: left;
            background: #f9fafb;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .details p {
            margin: 8px 0;
            font-size: 14px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .social-links a {
            display: inline-block;
            padding: 8px 16px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .social-links a:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Apnar chobir link ekhane dite paren -->
        <img src="https://via.placeholder.com/150" alt="Arafat Rohman" class="profile-img">
        
        <h1>Arafat Rohman</h1>
        <p class="bio">Web Developer & Content Creator</p>

        <div class="details">
            <p><strong>📧 Email:</strong> arafatbhai169@gmail.com</p>
            <p><strong>📍 Location:</strong> Bangladesh</p>
            <p><strong>💻 Profession:</strong> Freelancer & Student</p>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/aluu143" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/obito__6.9/" target="_blank">Instagram</a>
            <a href="mailto:arafatbhai169@gmail.com">Contact</a>
        </div>
    </div>

</body>
</html>
